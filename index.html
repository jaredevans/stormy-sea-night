<body>

  <div>Wind <b id="h-wind">--</b> kt &nbsp;·&nbsp; Seas <b>15</b> m &nbsp;·&nbsp; Heel <b id="h-heel">--</b>° &nbsp;·&nbsp; Pitch <b id="h-pitch">--</b>° &nbsp;·&nbsp; Speed <b id="h-sog">--</b> kt</div>
  <div class="keys">Drag to orbit · Scroll to zoom · <span data-k="c">C camera</span> · <span data-k="l">L deck lights</span> · <span data-k=" ">Space pause</span> · <span data-k="h">H hide</span></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ───────────────────────────── Renderer ───────────────────────────── */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  if (!renderer.capabilities.isWebGL2) throw new Error('webgl2');
} catch (e) {
  document.getElementById('err').style.display = 'flex';
  throw e;
}
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.3, 20000);

/* ───────────────────────────── Sea state ─────────────────────────────
   Eight trochoidal (Gerstner) wave trains. Significant wave height ≈ 15 m,
   dominant period ≈ 9.5 s — a mature hurricane sea. The same table drives
   the GPU surface and the CPU buoyancy model.                              */
const G = 9.81, STEEP = 0.92;
const WIND = new V3(-36, 0, 2.5);            // m/s (≈ 70 kt), blowing toward −x
const WAVES = [
  // wavelength (m), amplitude (m), heading offset (deg)
  [140, 4.50,   0], [ 95, 2.40,  16], [ 62, 1.30, -22], [ 45, 0.72,  31],
  [ 28, 0.40, -37], [ 17, 0.22,  11], [ 11, 0.12, -50], [  7, 0.067, 44],
].map(([L, A, deg], i) => {
  const a = Math.PI + deg * Math.PI / 180, k = 2 * Math.PI / L;
  return { L, A, k, dx: Math.cos(a), dz: Math.sin(a), om: Math.sqrt(G * k), ph: i * 1.713 + 0.4 };
});
const _d = { x: 0, y: 0, z: 0, J: 1 };
function waveDisp(px, pz, t, o, wantJ) {
  let x = 0, y = 0, z = 0, sxx = 0, szz = 0, sxz = 0;
  for (const w of WAVES) {
    const th = w.k * (w.dx * px + w.dz * pz) - w.om * t + w.ph;
    const c = Math.cos(th), s = Math.sin(th), h = STEEP * w.A * c;
    x += w.dx * h; z += w.dz * h; y += w.A * s;
    if (wantJ) { const q = STEEP * w.k * w.A * s; sxx += w.dx * w.dx * q; szz += w.dz * w.dz * q; sxz += w.dx * w.dz * q; }
  }
  o.x = x; o.y = y; o.z = z;
  if (wantJ) o.J = (1 - sxx) * (1 - szz) - sxz * sxz;
  return o;
}
/** Water surface height at a true horizontal position (inverts the Gerstner shear). */
function surfaceH(x, z, t) {
  let px = x, pz = z;
  for (let i = 0; i < 4; i++) { waveDisp(px, pz, t, _d); px = x - _d.x; pz = z - _d.z; }
  return waveDisp(px, pz, t, _d).y;
}

/* ───────────────────────────── Shared noise ───────────────────────────── */
const NOISE_N = 256;
const noiseData = new Uint8Array(NOISE_N * NOISE_N);
{ let s = 1337; for (let i = 0; i < noiseData.length; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; noiseData[i] = s >>> 24; } }
const noiseTex = new THREE.DataTexture(noiseData, NOISE_N, NOISE_N, THREE.RedFormat, THREE.UnsignedByteType);
noiseTex.wrapS = noiseTex.wrapT = THREE.RepeatWrapping;
noiseTex.magFilter = noiseTex.minFilter = THREE.LinearFilter;
noiseTex.needsUpdate = true;

// CPU mirror of the GLSL cloud field, so moonlight can dim as cloud crosses the moon.
const nAt = (ix, iy) => noiseData[((iy & 255) << 8) | (ix & 255)] / 255;
function vnoiseJS(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  let fx = x - ix, fy = y - iy; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = lerp(nAt(ix, iy), nAt(ix + 1, iy), fx), b = lerp(nAt(ix, iy + 1), nAt(ix + 1, iy + 1), fx);
  return lerp(a, b, fy);
}
function fbm5JS(x, y) {
  let s = 0, a = 0.5;
  for (let i = 0; i < 5; i++) { s += a * vnoiseJS(x, y); const nx = 1.6 * x - 1.2 * y + 3.1, ny = 1.2 * x + 1.6 * y + 7.7; x = nx; y = ny; a *= 0.5; }
  return s / 0.96875;
}

const MOON_DIR = new V3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 15.5), THREE.MathUtils.degToRad(90 + 31)).normalize();
const CLOUD_SCALE = 1.05, CLOUD_COVER = 0.43;

const U = {
  uNoise: { value: noiseTex },
  uTime: { value: 0 },
  uMoonDir: { value: MOON_DIR },
  uMoonVis: { value: 1 },
  uCloudOff: { value: new THREE.Vector4() },
  uCover: { value: CLOUD_COVER },
  uCloudScale: { value: CLOUD_SCALE },
};
function cloudDensJS(d) {
  const s = CLOUD_SCALE / (Math.max(d.y, 0) + 0.11), ux = d.x * s, uy = d.z * s, o = U.uCloudOff.value;
  const n = fbm5JS(ux + o.x, uy + o.y), c = vnoiseJS(ux * 0.37 + o.z, uy * 0.37 + o.w);
  return sstep(CLOUD_COVER, CLOUD_COVER + 0.26, n + 0.22 * (c - 0.5));
}

/* ───────────────────────────── GLSL: sky model ───────────────────────────── */
const GLSL_SKY = /* glsl */`
uniform sampler2D uNoise;
uniform float uTime;
uniform vec3 uMoonDir;
uniform float uMoonVis;
uniform vec4 uCloudOff;
uniform float uCover;
uniform float uCloudScale;
const vec3 MOONCOL = vec3(0.78, 0.87, 1.0);
const mat2 ROT = mat2(1.6, 1.2, -1.2, 1.6);

vec3 noised(vec2 p){
  ivec2 i = ivec2(floor(p)); vec2 f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f), du = 6.0*f*(1.0 - f);
  float a = texelFetch(uNoise, i & 255, 0).r, b = texelFetch(uNoise, (i + ivec2(1, 0)) & 255, 0).r;
  float c = texelFetch(uNoise, (i + ivec2(0, 1)) & 255, 0).r, d = texelFetch(uNoise, (i + ivec2(1, 1)) & 255, 0).r;
  float k1 = b - a, k2 = c - a, k4 = a - b - c + d;
  return vec3(a + k1*u.x + k2*u.y + k4*u.x*u.y, du*vec2(k1 + k4*u.y, k2 + k4*u.x));
}
float vnoise(vec2 p){
  ivec2 i = ivec2(floor(p)); vec2 f = fract(p);
  vec2 u = f*f*(3.0 - 2.0*f);
  float a = texelFetch(uNoise, i & 255, 0).r, b = texelFetch(uNoise, (i + ivec2(1, 0)) & 255, 0).r;
  float c = texelFetch(uNoise, (i + ivec2(0, 1)) & 255, 0).r, d = texelFetch(uNoise, (i + ivec2(1, 1)) & 255, 0).r;
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm5(vec2 p){ float s = 0.0, a = 0.5; for(int i=0;i<5;i++){ s += a*vnoise(p); p = ROT*p + vec2(3.1, 7.7); a *= 0.5; } return s/0.96875; }
float fbm2(vec2 p){ return (vnoise(p)*0.5 + vnoise(ROT*p + vec2(3.1, 7.7))*0.25)/0.75; }
float fbm3(vec2 p){ float s = 0.0, a = 0.5; for(int i=0;i<3;i++){ s += a*vnoise(p); p = ROT*p + vec2(3.1, 7.7); a *= 0.5; } return s/0.875; }

vec2 cloudUV(vec3 d){ return d.xz*(uCloudScale/(max(d.y, 0.0) + 0.11)); }
float cloudShape(float n, float c){ return smoothstep(uCover, uCover + 0.26, n + 0.22*(c - 0.5)); }
float cloudHi(vec3 d){ vec2 uv = cloudUV(d); return cloudShape(fbm5(uv + uCloudOff.xy), vnoise(uv*0.37 + uCloudOff.zw)); }
float cloudLo(vec3 d){ vec2 uv = cloudUV(d); return cloudShape(fbm3(uv + uCloudOff.xy), vnoise(uv*0.37 + uCloudOff.zw)); }
float cloudSoft(vec3 d){ vec2 uv = cloudUV(d); return smoothstep(uCover - 0.10, uCover + 0.38, fbm2(uv + uCloudOff.xy) + 0.22*(vnoise(uv*0.37 + uCloudOff.zw) - 0.5)); }

vec3 horizonColor(vec3 d){
  vec2 a = normalize(d.xz + vec2(1e-5)), m = normalize(uMoonDir.xz);
  float g = pow(max(dot(a, m), 0.0), 5.0);
  return vec3(0.011, 0.016, 0.027) + MOONCOL*vec3(0.040, 0.046, 0.056)*g*(0.3 + 0.7*uMoonVis);
}
vec3 skyBase(vec3 d){
  float md = max(dot(d, uMoonDir), 0.0);
  float h = clamp(d.y, 0.0, 1.0);
  vec3 c = mix(vec3(0.011, 0.017, 0.032), vec3(0.002, 0.004, 0.012), pow(h, 0.45));
  c += MOONCOL*(0.022*pow(md, 3.0) + 0.09*pow(md, 28.0));
  return c;
}
vec3 cloudLit(vec3 d, float dens, float shade, float sharp){
  float md = max(dot(d, uMoonDir), 0.0);
  float thin = exp(-dens*mix(1.2, 2.4, sharp));
  vec3 c = vec3(0.012, 0.017, 0.028)*(0.55 + 0.45*shade);
  c += MOONCOL*0.060*shade;
  c += MOONCOL*(0.16*pow(md, 4.0) + mix(0.40*pow(md, 12.0), 0.55*pow(md, 22.0) + 1.5*pow(md, 140.0), sharp))*thin;
  return c;
}
vec3 skyLite(vec3 d){
  vec3 col = skyBase(d);
  float dens = cloudSoft(d);
  col = mix(col, cloudLit(d, dens, 0.6, 0.0), 1.0 - exp(-dens*3.0));
  return mix(col, horizonColor(d), exp(-max(d.y, 0.0)*9.0));
}
`;

/* ───────────────────────────── Sky dome ───────────────────────────── */
const skyVert = /* glsl */`
varying vec3 vDir;
void main(){ vDir = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position, 1.0); }`;
const skyFrag = /* glsl */`
${GLSL_SKY}
uniform float uEnv;
varying vec3 vDir;
const float MOON_R = 0.030;

float hash31(vec3 p){ p = fract(p*0.1031); p += dot(p, p.yzx + 33.33); return fract((p.x + p.y)*p.z); }
vec3 stars(vec3 d){
  vec3 p = d*190.0, i = floor(p), f = fract(p) - 0.5;
  float h = hash31(i);
  float s = smoothstep(0.9935, 1.0, h)*(1.0 - smoothstep(0.04, 0.40, length(f)));
  float tw = 0.75 + 0.25*sin(uTime*3.0 + h*900.0);
  return mix(vec3(1.0, 0.85, 0.7), vec3(0.75, 0.86, 1.0), fract(h*91.7))*s*tw*1.3;
}
vec3 moonDisc(vec3 d){
  float md = dot(d, uMoonDir);
  if (md < cos(MOON_R*1.08)) return vec3(0.0);
  vec3 mx = normalize(cross(vec3(0.0, 1.0, 0.0), uMoonDir)), my = cross(uMoonDir, mx);
  vec2 q = vec2(dot(d, mx), dot(d, my))/sin(MOON_R);
  float r2 = dot(q, q);
  float z = sqrt(max(1.0 - r2, 0.0));
  vec2 s = q*(1.0 + 0.28*r2);
  float maria = fbm5(s*1.55 + vec2(11.3, 4.2));
  float fine = fbm5(s*6.5 + vec2(2.0, 9.0));
  float alb = mix(0.36, 1.0, smoothstep(0.40, 0.60, maria))*(0.80 + 0.40*fine);
  float limb = mix(0.72, 1.0, pow(z, 0.6));
  return vec3(1.0, 0.965, 0.89)*alb*limb*(1.0 - smoothstep(0.93, 1.0, r2))*3.4;
}
void main(){
  vec3 d = normalize(vDir);
  vec3 col = skyBase(d);
  float md = max(dot(d, uMoonDir), 0.0);
  float ang = acos(min(md, 1.0));
  vec3 disc = vec3(0.0);
  if (uEnv < 0.5) {
    col += stars(d)*(1.0 - 0.8*pow(md, 6.0))*smoothstep(0.0, 0.25, d.y);
    disc = moonDisc(d);
    col += MOONCOL*(0.42*exp(-ang*26.0) + 0.05*exp(-ang*7.0));
  }
  float dens = cloudHi(d);
  float alpha = 1.0 - exp(-dens*4.0);
  float dens2 = cloudLo(normalize(d + uMoonDir*0.07));
  float shade = exp(-dens2*1.8)*(0.55 + 0.45*exp(-dens*1.5));
  col = mix(col, cloudLit(d, dens, shade, 1.0), alpha) + disc*exp(-dens*2.6);
  if (uEnv < 0.5) col += MOONCOL*0.55*exp(-ang*15.0)*alpha*exp(-dens*2.2);   // corona through thin cloud
  col = mix(col, horizonColor(d), exp(-max(d.y, 0.0)*9.0));
  if (uEnv > 0.5) col *= mix(0.35, 1.0, smoothstep(-0.25, 0.02, d.y));
  gl_FragColor = vec4(col, 1.0);
}`;
function makeSkyMaterial(env) {
  return new THREE.ShaderMaterial({
    uniforms: { ...U, uEnv: { value: env } }, vertexShader: skyVert, fragmentShader: skyFrag,
    side: THREE.BackSide, depthTest: false, depthWrite: false,
  });
}
const skyGeo = new THREE.SphereGeometry(5000, 48, 24);
const sky = new THREE.Mesh(skyGeo, makeSkyMaterial(0));
sky.renderOrder = -1000; sky.frustumCulled = false;
scene.add(sky);

// Image-based ambient from the same sky, so the boat sits in the scene's light.
try {
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(skyGeo, makeSkyMaterial(1)));
  U.uCloudOff.value.set(4.2, 1.7, 0.6, 2.9);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0, 1, 12000).texture;
  scene.environmentIntensity = 1.6;
  pm.dispose();
} catch (e) { console.warn('env map skipped', e); }

/* ───────────────────────────── Ocean ───────────────────────────── */
function buildOceanGeometry() {
  const SEG = 420, radii = [];
  for (let n = 0, r = 0; r < 7000; n++) { r = 0.5 * (Math.pow(1.018, n) - 1) / 0.018; radii.push(r); }
  const R = radii.length, pos = new Float32Array(R * SEG * 3), idx = new Uint32Array((R - 1) * SEG * 6);
  for (let i = 0; i < R; i++) for (let s = 0; s < SEG; s++) {
    const a = (s + (i & 1) * 0.5) / SEG * Math.PI * 2, o = (i * SEG + s) * 3;
    pos[o] = Math.cos(a) * radii[i]; pos[o + 1] = 0; pos[o + 2] = Math.sin(a) * radii[i];
  }
  let p = 0;
  for (let i = 0; i < R - 1; i++) for (let s = 0; s < SEG; s++) {
    const a = i * SEG + s, b = i * SEG + (s + 1) % SEG, c = a + SEG, d = b + SEG;
    idx[p++] = a; idx[p++] = c; idx[p++] = b; idx[p++] = b; idx[p++] = c; idx[p++] = d;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  return g;
}
const oceanU = {
  ...U,
  uWaveA: { value: WAVES.map(w => new THREE.Vector4(w.dx, w.dz, w.k, w.A)) },
  uWaveB: { value: WAVES.map(w => new THREE.Vector2(w.om, w.ph)) },
  uOffset: { value: new THREE.Vector2() },
  uBoat: { value: new THREE.Vector4(1, 0, 0, 0) },
  uWindDir: { value: new THREE.Vector2(WIND.x, WIND.z).normalize() },
  uMoonE: { value: 2.1 },
  uDeckLight: { value: 1 },
  uPix: { value: 0.001 },
};
const oceanVert = /* glsl */`
#define NW 8
uniform vec4 uWaveA[NW];
uniform vec2 uWaveB[NW];
uniform vec2 uOffset;
uniform float uTime;
varying vec2 vP0;
varying vec3 vWorld;
void main(){
  vec2 p0 = position.xz + uOffset;
  float sp = 0.018*length(position.xz) + 0.5;          // local grid spacing
  vec3 d = vec3(0.0);
  for (int i = 0; i < NW; i++) {
    vec4 w = uWaveA[i];
    float L = 6.2831853/w.z;
    float f = 1.0 - smoothstep(L*0.2, L*0.4, sp);        // drop waves the grid can't resolve
    float th = w.z*dot(w.xy, p0) - uWaveB[i].x*uTime + uWaveB[i].y;
    d.xz += w.xy*(${STEEP.toFixed(3)}*w.w*f)*cos(th);
    d.y += w.w*f*sin(th);
  }
  vec3 p = position + d;
  vP0 = p0; vWorld = p;
  gl_Position = projectionMatrix*viewMatrix*vec4(p, 1.0);
}`;
const oceanFrag = /* glsl */`
#define NW 8
${GLSL_SKY}
uniform vec4 uWaveA[NW];
uniform vec2 uWaveB[NW];
uniform vec4 uBoat;
uniform vec2 uWindDir;
uniform float uMoonE;
uniform float uDeckLight;
uniform float uPix;
varying vec2 vP0;
varying vec3 vWorld;
const float STEEP = ${STEEP.toFixed(3)};
// small wind ripples: (angle, wavelength)
#define NR 10
const vec2 RIP[NR] = vec2[NR](vec2(3.34, 8.3), vec2(2.84, 6.1), vec2(3.62, 4.9), vec2(2.58, 3.9), vec2(3.92, 2.9), vec2(3.05, 2.3),
                              vec2(2.24, 1.8), vec2(3.46, 1.3), vec2(2.76, 0.95), vec2(3.78, 0.7));
float band(float L, float fp){ return 1.0 - smoothstep(L*0.22, L*0.6, fp); }

void main(){
  vec3 toCam = cameraPosition - vWorld;
  float dist = length(toCam);
  vec3 V = toCam/dist;
  // footprint of one pixel on the sea surface (m): band-limits every detail layer
  float fp = dist*uPix/max(abs(V.y), 0.035);

  // ── analytic normal + surface convergence (Jacobian) of the wave field, per pixel.
  //    A second Jacobian, evaluated 1.4 s in the past, marks where crests have just broken.
  vec2 slope = vec2(0.0);
  float ny = 0.0, sxx = 0.0, szz = 0.0, sxz = 0.0, txx = 0.0, tzz = 0.0, txz = 0.0;
  for (int i = 0; i < NW; i++) {
    vec4 w = uWaveA[i];
    float f = band(6.2831853/w.z, fp);
    float th = w.z*dot(w.xy, vP0) - uWaveB[i].x*uTime + uWaveB[i].y;
    float WA = w.z*w.w*f;
    slope += w.xy*(WA*cos(th));
    float q = STEEP*WA*sin(th);
    ny += q; sxx += w.x*w.x*q; szz += w.y*w.y*q; sxz += w.x*w.y*q;
    float q2 = STEEP*WA*sin(th + uWaveB[i].x*1.4);
    txx += w.x*w.x*q2; tzz += w.y*w.y*q2; txz += w.x*w.y*q2;
  }
  float J = (1.0 - sxx)*(1.0 - szz) - sxz*sxz;
  float Jold = (1.0 - txx)*(1.0 - tzz) - txz*txz;

  // ── wind ripples (analytic) + chop from derivative noise, rotated per octave
  vec2 ds = vec2(0.0);
  for (int i = 0; i < NR; i++) {
    float L = RIP[i].y, k = 6.2831853/L;
    vec2 D = vec2(cos(RIP[i].x), sin(RIP[i].x));
    ds += D*(0.092*band(L, fp))*cos(k*dot(D, vP0) - sqrt(9.81*k)*uTime + float(i)*2.1);
  }
  vec2 q1 = vP0*0.55 + uTime*vec2(-1.1, 0.2);
  ds += noised(q1).yz*0.15*(0.3 + 0.7*band(3.6, fp));
  vec2 q2 = mat2(0.8, 0.6, -0.6, 0.8)*vP0*1.45 + uTime*vec2(-1.7, -0.5);

  requestAnimationFrame(frame);
}
resize();
frame();
</script>
